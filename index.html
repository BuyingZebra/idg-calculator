<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>IDG Calculator</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS App Mode -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="IDG"
  >

  <!-- App Icons -->
  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

  <!-- Theme -->
  <meta
    name="theme-color"
    content="#0f172a"
  >

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <h1>IDG Calculator</h1>

  <!-- ========================= -->
  <!-- SECTION A -->
  <!-- ========================= -->

  <div class="section" id="sectionA">

    <h2>Dockside Grading Summary</h2>

    <div class="row">
      <span>Premium</span>
      <input
        class="cat"
        data-key="premium"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Standard</span>
      <input
        class="cat"
        data-key="standard"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Critical Weak</span>
      <input
        class="cat"
        data-key="critical_weak"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Soft Shell</span>
      <input
        class="cat"
        data-key="soft_shell"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Dead</span>
      <input
        class="cat"
        data-key="dead"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Less than 3.74"</span>
      <input
        class="cat"
        data-key="under_sized"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Barn. / Tubeworm</span>
      <input
        class="cat"
        data-key="barnacle_tubeworm"
        type="text"
        inputmode="decimal"
      >
    </div>

    <div class="row">
      <span>Gross Lbs. Graded</span>
      <input
      class="cat"
      data-key="gross_lbs_graded"
      id="grossSample"
      type="text"
      inputmode="decimal"
    >
    </div>

    <!-- RESULTS -->

    <div class="results-section">

      <div
        class="results-toggle"
        onclick="toggle_results('resultsContent', 'resultsArrow')"
      >

        <div
          id="resultsArrow"
          class="toggle-icon-stack"
        >

          <img
            class="toggle-icon icon-on"
            src="./icons/radial_button_checked.svg"
          >

          <img
            class="toggle-icon icon-off"
            src="./icons/radial_button_unchecked.svg"
          >

        </div>

        <h3>Results</h3>

      </div>

      <div
        id="resultsContent"
        class="results-content"
      >

        <div id="results"></div>

      </div>

    </div>

    <!-- BUTTONS -->

    <div class="button-row">

      <button onclick="section_a.calculate()">
        Calculate
      </button>

      <button
        class="clear-btn"
        onclick="section_a_clear_data()"
      >
        Clear
      </button>

    </div>

  </div>

  <!-- ========================= -->
  <!-- SECTION B -->
  <!-- ========================= -->

  <div class="section" id="sectionB">

    <h2>Landed Pounds Summary</h2>

    <div class="row">
      <span>Gross Pounds Landed</span>
      <input
      class="section-b-input"
      data-key="gross_pounds_landed"
      id="grossWeight"
      type="text"
      inputmode="decimal"
    >
    </div>

    <div class="row">
      <span>Total # of Pans</span>
      <input
      class="section-b-input"
      data-key="total_number_of_pans"
      id="pans"
      type="number"
    >
    </div>

    <!-- RESULTS -->

    <div class="results-section">

      <div
        class="results-toggle"
        onclick="toggle_results('landedResultsContent', 'landedResultsArrow')"
      >

        <div
          id="landedResultsArrow"
          class="toggle-icon-stack"
        >

          <img
            class="toggle-icon icon-on"
            src="./icons/radial_button_checked.svg"
          >

          <img
            class="toggle-icon icon-off"
            src="./icons/radial_button_unchecked.svg"
          >

        </div>

        <h3>Results</h3>

      </div>

      <div
        id="landedResultsContent"
        class="results-content"
      >

        <div id="landedResults"></div>

      </div>

    </div>

    <!-- BUTTONS -->

    <div class="button-row">

      <button onclick="section_b.calculate()">
        Calculate
      </button>

      <button
        class="clear-btn"
        onclick="section_b_clear_data()"
      >
        Clear
      </button>

    </div>

  </div>

  <!-- FORMULA MODAL -->

  <div id="formulaModal" class="modal">

    <div class="modal-content">

      <span
        class="close"
        onclick="helper_disable()"
      >
        ×
      </span>

      <div id="formulaText"></div>

    </div>

  </div>

  <!-- SCRIPTS -->

  <script src="dictionary.js"></script>
  <script src="app.js"></script>

</body>

</html>
