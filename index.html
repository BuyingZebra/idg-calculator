<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>IDG Calculator</title>

<!-- ========================================================= -->
<!-- PWA -->
<!-- ========================================================= -->

<link rel="manifest" href="manifest.json">

<meta
name="theme-color"
content="#0f172a"
>

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<meta
name="apple-mobile-web-app-title"
content="IDG"
>

<link
rel="apple-touch-icon"
href="icon-192.png"
>

<!-- ========================================================= -->
<!-- STYLES -->
<!-- ========================================================= -->

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================================================= -->
<!-- APP SHELL -->
<!-- ========================================================= -->

<div class="app-shell">

<main class="workflow-viewport">

<!-- ========================================================= -->
<!-- PAGE RAIL -->
<!-- ========================================================= -->

<div
class="workflow-rail"
id="workflowRail"
>

<!-- ========================================================= -->
<!-- PAGE 1 -->
<!-- ========================================================= -->

<section class="workflow-page">

<div class="workflow-card">

<!-- HEADER -->

<div class="workflow-card-header">

<div class="workflow-card-title-group">

<img
class="workflow-card-icon"
src="./icons/checkbook.svg"
alt="Dockside"
>

<div class="workflow-card-heading">

<h2>
Dockside Grading Summary
</h2>

<p>
Grade sample quality & percentages
</p>

</div>

</div>

</div>

<!-- BODY -->

<div class="workflow-card-body">

<div class="section-content">

<!-- INPUTS -->

<div class="row">
<span>Premium</span>
<input
class="cat"
data-key="premium"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Standard</span>
<input
class="cat"
data-key="standard"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Critical Weak</span>
<input
class="cat"
data-key="critical_weak"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Soft Shell</span>
<input
class="cat"
data-key="soft_shell"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Dead</span>
<input
class="cat"
data-key="dead"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Less than 3.74"</span>
<input
class="cat"
data-key="under_sized"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Barn. / Tubeworm</span>
<input
class="cat"
data-key="barnacle_tubeworm"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Gross Lbs. Graded</span>
<input
class="cat"
data-key="gross_lbs_graded"
id="grossSample"
type="text"
inputmode="decimal"
>
</div>

<!-- BUTTONS -->

<div class="button-row">

<button onclick="section_a.calculate()">
Calculate
</button>

<button
class="clear-btn"
onclick="section_a_clear_data()"
>
Clear
</button>

</div>

<!-- RESULTS -->

<div class="results-section">

<div
class="results-toggle"
onclick="toggle_results('resultsContent','resultsArrow')"
>

<div
id="resultsArrow"
class="toggle-icon-stack"
>

<img
class="toggle-icon icon-on"
src="./icons/visibility.svg"
alt="Open"
>

<img
class="toggle-icon icon-off"
src="./icons/visibility_off.svg"
alt="Closed"
>

</div>

<h3>
Check Results
</h3>

</div>

<div
id="resultsContent"
class="results-content"
>

<div class="results-inner">
<div id="results"></div>
</div>

</div>

</div>

</div>

</div>

</div>

</section>

<!-- ========================================================= -->
<!-- PAGE 2 -->
<!-- ========================================================= -->

<section class="workflow-page">

<div class="workflow-card">

<!-- HEADER -->

<div class="workflow-card-header">

<div class="workflow-card-title-group">

<img
class="workflow-card-icon"
src="./icons/receipt_long.svg"
alt="Inspection"
>

<div class="workflow-card-heading">

<h2>
Inspection Summary
</h2>

<p>
Calculate landed crab estimates
</p>

</div>

</div>

</div>

<!-- BODY -->

<div class="workflow-card-body">

<div class="section-content">

<!-- INPUTS -->

<div class="row">
<span>Gross Pounds Landed</span>
<input
class="section-b-input"
data-key="gross_pounds_landed"
id="grossWeight"
type="text"
inputmode="decimal"
>
</div>

<div class="row">
<span>Total # of Pans</span>
<input
class="section-b-input"
data-key="total_number_of_pans"
id="pans"
type="number"
>
</div>

<!-- BUTTONS -->

<div class="button-row">

<button onclick="section_b.calculate()">
Calculate
</button>

<button
class="clear-btn"
onclick="section_b_clear_data()"
>
Clear
</button>

</div>

<!-- RESULTS -->

<div class="results-section">

<div
class="results-toggle"
onclick="toggle_results('landedResultsContent','landedResultsArrow')"
>

<div
id="landedResultsArrow"
class="toggle-icon-stack"
>

<img
class="toggle-icon icon-on"
src="./icons/visibility.svg"
alt="Open"
>

<img
class="toggle-icon icon-off"
src="./icons/visibility_off.svg"
alt="Closed"
>

</div>

<h3>
Check Results
</h3>

</div>

<div
id="landedResultsContent"
class="results-content"
>

<div class="results-inner">
<div id="landedResults"></div>
</div>

</div>

</div>

</div>

</div>

</div>

</section>

</div>

</main>

</div>

<!-- ========================================================= -->
<!-- FORMULA MODAL -->
<!-- ========================================================= -->

<div
id="formulaModal"
class="modal"
>

<div class="modal-content">

<span
class="close"
onclick="helper_disable()"
>
×
</span>

<div id="formulaText"></div>

</div>

</div>

<!-- ========================================================= -->
<!-- SCRIPTS -->
<!-- ========================================================= -->

<script src="dictionary.js"></script>
<script src="app.js"></script>

</body>

</html>
